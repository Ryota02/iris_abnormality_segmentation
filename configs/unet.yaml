seed: 42


data:
  root: /media/share/Member/ueki/datasets/iris_segmentation
  category: 
    - Geometry
    - Healthy

  raw:
    geometry_images: /media/share/Member/ueki/datasets/iris_segmentation/Geometry/images
    geometry_masks: /media/share/Member/ueki/datasets/iris_segmentation/Geometry/mask

    tissue_images: /media/share/Member/ueki/datasets/iris_segmentation/Tissue/images
    tissue_masks: /media/share/Member/ueki/datasets/iris_segmentation/Tissue/mask

    healthy_images: /media/share/Member/ueki/datasets/iris_segmentation/Healthy

  output_dir: /media/share/Member/ueki/datasets/iris_segmentation

  split:
    train_ratio: 0.70
    val_ratio: 0.15
    test_ratio: 0.15


model:
  name: unet
  # architecture: unet
  in_channels: 1
  out_channels: 1
  base_channels: 32


training:
  image_size: 512

  epochs: 100
  batch_size: 8

  learning_rate: 0.0001
  weight_decay: 0.0001

  num_workers: 0

  threshold: 0.5

  loss:
    bce_weight: 0.5
    dice_weight: 0.5

  scheduler:
    enabled: false
    factor: 0.5
    patience: 5


augmentation:
  horizontal_flip:
    enabled: true
    probability: 0.5

  rotation:
    enabled: true
    probability: 0.5
    limit: 10


output:
  dir: outputs/unet
  checkpoint: best_model.pt
  history: history.csv
  loss_curve: loss_curve.png
  metric_curve: metric_curve.png
  evaluation_dir: outputs/unet/evaluation
  prediction_dir: outputs/unet/predictions


evaluation:
  output_dir: outputs/unet/evaluation
  threshold: 0.5


prediction:
  threshold: 0.5
  output: prediction.png