seed: 42

data:
  root: /media/share/Member/ueki/datasets/iris_segmentation
  category: 
    - Geometry
    - Tissue
    - Healthy


model:
  name: unet_resnet

  backbone: resnet34

  pretrained: true

  in_channels: 1
  out_channels: 1


training:
  image_size: 512

  epochs: 100
  batch_size: 8

  learning_rate: 0.0001
  weight_decay: 0.0001

  num_workers: 0

  threshold: 0.5

  loss:
    bce_weight: 0.5
    dice_weight: 0.5

  scheduler:
    enabled: false
    factor: 0.5
    patience: 5


augmentation:
  horizontal_flip:
    enabled: true
    probability: 0.5

  rotation:
    enabled: true
    probability: 0.5
    limit: 10


output:
  dir: outputs/unet_resnet34
  checkpoint: best_model.pt
  history: history.csv
  loss_curve: loss_curve.png
  metric_curve: metric_curve.png
  evaluation_dir: outputs/unet_resnet34/evaluation
  prediction_dir: outputs/unet_resnet34/predictions